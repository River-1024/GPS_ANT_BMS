<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BMS 横屏仪表盘现代扁平视觉稿</title>
  <style>
    :root {
      --bg: #0c1110;
      --surface: #151d1b;
      --surface-2: #1b2825;
      --surface-3: #20312d;
      --line: rgba(232, 246, 241, 0.12);
      --text: #f3faf7;
      --muted: #8fa29c;
      --dim: #5f716c;
      --green: #39e36c;
      --green-soft: rgba(57, 227, 108, 0.16);
      --cyan: #59d8f5;
      --yellow: #f4c85a;
      --blue: #6aa6ff;
      --value-scale: 1;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #070b0a;
      color: var(--text);
      font-family: "Microsoft YaHei", "Segoe UI", sans-serif;
    }

    .screen {
      width: min(96vw, 1180px);
      aspect-ratio: 16 / 9;
      padding: clamp(12px, 1.5vw, 18px);
      background: var(--bg);
      border-radius: 8px;
      overflow: hidden;
    }

    .dashboard {
      height: 100%;
      display: grid;
      grid-template-columns: 0.68fr 3.32fr;
      grid-template-rows: 1.08fr 0.92fr;
      gap: clamp(10px, 1.2vw, 14px);
    }

    .soc,
    .metric,
    .power-panel {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
    }

    .soc {
      grid-column: 1;
      grid-row: 1;
      padding: clamp(12px, 1.6vw, 18px);
      display: grid;
      place-items: center;
      min-width: 0;
      position: relative;
      overflow: hidden;
    }

    .soc::before {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 92%;
      background: var(--green);
      opacity: 0.92;
    }

    .soc-value {
      position: relative;
      z-index: 1;
      color: #07110b;
      font-size: calc(clamp(56px, 7.6vw, 98px) * var(--value-scale));
      font-weight: 850;
      line-height: 0.9;
      text-align: center;
      letter-spacing: 0;
    }

    .soc-value span {
      color: #07110b;
      font-size: 0.34em;
      margin-left: 4px;
    }

    .metric-grid {
      grid-column: 2;
      grid-row: 1;
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: clamp(10px, 1.2vw, 14px);
    }

    .metric {
      min-width: 0;
      overflow: hidden;
      padding: clamp(10px, 1.2vw, 14px);
      display: grid;
      place-items: center;
      align-content: center;
    }

    .metric .value {
      max-width: 100%;
      font-size: calc(clamp(29px, 3.55vw, 50px) * var(--value-scale));
      font-weight: 820;
      line-height: 1;
      white-space: nowrap;
      letter-spacing: 0;
      text-align: center;
      transform-origin: center;
    }

    .metric .unit {
      margin-left: 2px;
      color: var(--muted);
      font-size: 0.32em;
      font-weight: 750;
    }

    .metric.long .value {
      font-size: calc(clamp(26px, 3.25vw, 44px) * var(--value-scale));
    }

    .metric.primary {
      background: var(--surface-2);
    }

    .metric.primary .value,
    .metric.power .value {
      color: var(--green);
    }

    .metric.current .value {
      color: var(--cyan);
    }

    .metric.warning .value,
    .temp-chip strong {
      color: var(--yellow);
    }

    .temp-pack {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      width: 100%;
    }

    .temp-chip {
      min-width: 0;
      height: 40px;
      padding: 0 8px;
      display: grid;
      place-items: center;
      border-radius: 6px;
      background: rgba(244, 200, 90, 0.08);
      white-space: nowrap;
    }

    .temp-chip strong {
      font-size: calc(clamp(17px, 1.85vw, 25px) * var(--value-scale));
      line-height: 1;
    }

    .power-panel {
      grid-column: 1 / 3;
      grid-row: 2;
      padding: clamp(10px, 1.25vw, 16px);
      display: grid;
      grid-template-rows: auto 1fr;
      gap: 10px;
      background: var(--surface);
    }

    .power-head {
      min-width: 0;
      display: grid;
      grid-template-columns: minmax(120px, 0.55fr) minmax(220px, 1fr) auto;
      align-items: center;
      gap: clamp(10px, 1.5vw, 18px);
    }

    .power-title {
      min-width: 0;
      display: grid;
      align-items: center;
    }

    .power-title .watts {
      color: var(--green);
      font-size: calc(clamp(36px, 5vw, 64px) * var(--value-scale));
      font-weight: 850;
      line-height: 0.95;
      white-space: nowrap;
    }

    .status-row {
      min-width: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(8px, 1.3vw, 18px);
      color: var(--muted);
      font-size: clamp(11px, 1.1vw, 14px);
      white-space: nowrap;
    }

    .status-dot {
      display: inline-block;
      width: 7px;
      height: 7px;
      margin-right: 6px;
      border-radius: 50%;
      background: var(--green);
    }

    .controls {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
    }

    .segmented {
      height: 34px;
      padding: 3px;
      display: flex;
      align-items: center;
      border-radius: 8px;
      background: #101715;
      border: 1px solid var(--line);
    }

    button {
      height: 28px;
      min-width: 64px;
      padding: 0 12px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    button.active {
      background: var(--green);
      color: #07110b;
    }

    .back {
      height: 34px;
      min-width: 58px;
      border: 1px solid var(--line);
      background: transparent;
      color: var(--text);
    }

    .visual {
      min-height: 0;
      position: relative;
      border-radius: 8px;
      background: #101715;
      overflow: hidden;
    }

    .bar-mode,
    .chart-mode {
      position: absolute;
      inset: 0;
      opacity: 0;
      pointer-events: none;
      transition: opacity 160ms ease;
    }

    .visual[data-mode="bar"] .bar-mode,
    .visual[data-mode="chart"] .chart-mode {
      opacity: 1;
      pointer-events: auto;
    }

    .bar-mode {
      padding: clamp(16px, 2vw, 24px);
      display: grid;
      align-content: center;
      gap: 12px;
    }

    .bar-track {
      height: clamp(34px, 5.4vw, 62px);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.08);
      overflow: hidden;
      position: relative;
    }

    .bar-fill {
      width: 20%;
      height: 100%;
      background: var(--green);
    }

    .bar-track::after {
      content: "20%";
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      color: var(--text);
      font-size: calc(clamp(22px, 2.9vw, 38px) * var(--value-scale));
      font-weight: 850;
    }

    .scale {
      display: flex;
      justify-content: space-between;
      color: var(--dim);
      font-size: clamp(11px, 1.1vw, 14px);
    }

    svg {
      width: 100%;
      height: 100%;
      display: block;
    }
  </style>
</head>
<body>
  <main class="screen" aria-label="BMS 横屏仪表盘现代扁平视觉稿">
    <section class="dashboard">
      <article class="soc">
        <div class="soc-value">92<span>%</span></div>
      </article>

      <section class="metric-grid">
        <article class="metric primary long">
          <div class="value">121.40<span class="unit">Ah</span></div>
        </article>
        <article class="metric primary long">
          <div class="value">182.1<span class="unit">km</span></div>
        </article>
        <article class="metric power">
          <div class="value">8<span class="unit">W</span></div>
        </article>
        <article class="metric long">
          <div class="value">81.18<span class="unit">V</span></div>
        </article>
        <article class="metric current">
          <div class="value">0.0<span class="unit">A</span></div>
        </article>
        <article class="metric warning">
          <div class="value">7<span class="unit">mV</span></div>
        </article>
        <article class="metric">
          <div class="temp-pack">
            <span class="temp-chip"><strong>35°</strong></span>
            <span class="temp-chip"><strong>37°</strong></span>
            <span class="temp-chip"><strong>34°</strong></span>
            <span class="temp-chip"><strong>34°</strong></span>
          </div>
        </article>
        <article class="metric">
          <div class="value">100<span class="unit">%</span></div>
        </article>
      </section>

      <section class="power-panel">
        <div class="power-head">
          <div class="power-title">
            <span class="watts">8W</span>
          </div>
          <div class="status-row">
            <span><i class="status-dot"></i>预览模式</span>
            <span>GPS 预览</span>
            <span>未连接保护板</span>
          </div>
          <div class="controls">
            <div class="segmented" role="group" aria-label="功率显示模式">
              <button id="barBtn" class="active" type="button">功率条</button>
              <button id="chartBtn" type="button">曲线图</button>
            </div>
            <button class="back" type="button">返回</button>
          </div>
        </div>

        <div id="visual" class="visual" data-mode="bar">
          <div class="bar-mode">
            <div class="bar-track">
              <div class="bar-fill"></div>
            </div>
            <div class="scale">
              <span>0W</span>
              <span>500W</span>
              <span>1000W</span>
            </div>
          </div>

          <div class="chart-mode">
            <svg viewBox="0 0 720 180" role="img" aria-label="功率曲线图">
              <defs>
                <pattern id="grid" width="72" height="60" patternUnits="userSpaceOnUse">
                  <path d="M 72 0 L 0 0 0 60" fill="none" stroke="rgba(243,250,247,0.08)" stroke-width="1"/>
                </pattern>
              </defs>
              <rect width="720" height="180" fill="url(#grid)"/>
              <line x1="0" y1="90" x2="720" y2="90" stroke="rgba(243,250,247,0.18)" stroke-width="1"/>
              <text x="16" y="28" fill="#5f716c" font-size="14">+1000W</text>
              <text x="16" y="84" fill="#5f716c" font-size="14">0W</text>
              <text x="16" y="164" fill="#5f716c" font-size="14">-1000W</text>
              <polyline
                points="0,92 48,88 96,78 144,82 192,70 240,74 288,68 336,82 384,80 432,88 480,84 528,72 576,78 624,70 672,74 720,76"
                fill="none"
                stroke="#39e36c"
                stroke-width="4"
                stroke-linecap="round"
                stroke-linejoin="round"/>
              <circle cx="720" cy="76" r="6" fill="#39e36c"/>
            </svg>
          </div>
        </div>
      </section>
    </section>
  </main>

  <script>
    const visual = document.getElementById("visual");
    const barBtn = document.getElementById("barBtn");
    const chartBtn = document.getElementById("chartBtn");

    function setMode(mode) {
      visual.dataset.mode = mode;
      barBtn.classList.toggle("active", mode === "bar");
      chartBtn.classList.toggle("active", mode === "chart");
    }

    barBtn.addEventListener("click", () => setMode("bar"));
    chartBtn.addEventListener("click", () => setMode("chart"));
  </script>
</body>
</html>
